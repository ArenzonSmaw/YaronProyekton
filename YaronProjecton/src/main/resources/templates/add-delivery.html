<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="height: 100%; margin: 0;"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{master.html}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

</head>
<body>
<section layout:fragment="content">
 <h1>Add Delivery</h1>
 <form th:action="@{/processDelivery}" th:object="${delivery}" method="post">
     <div th:if="${#fields.hasErrors('*')}" class="bg-light border border-danger text-danger p-2">
         <ul>
             <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
         </ul>
     </div>
     </br>
     <div class="container justify-content-center">
         <p>Customer ID: <input type="text" th:field="*{customerID}" placeholder="Customer ID" th:value="*{customerID}"></p>
         <p>Weight in Kg: <input type="number" step="0.5" th:field="*{weight}" placeholder="Delivery Weight" th:value="*{weight}"></p>
         <p>Destination: <input type="text" th:field="*{destination}" placeholder="Delivery Destination" th:value="*{destination}"></p>
         <input type="hidden" th:if="${delivery.deliveryNo != 0}" th:field="*{deliveryNo}" th:value="${delivery.deliveryNo}">
         <input type="hidden" th:if="${delivery.ref != null}" th:field="*{refId}" th:value="${delivery.ref.delivererID}">
         <div class="row justify-content-start">
             <div class="col">
                 <input class="btn btn-primary" type="submit" value="Save">
             </div>
             <div class="col">
                 <button class="btn btn-secondary" type="button" onclick="history.back()">Back</button>
             </div>
         </div>
     </div>

 </form>
 <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
 <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</section>
</body>
</html>
