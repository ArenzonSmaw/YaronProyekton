<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{master.html}" lang="en">
<head>
    <title th:text="${title}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

</head>
<body>
<section layout:fragment="content">
    <h2>Delivery Persons</h2>
    <table class="table table-striped table-bordered">
        <tr>
            <th scope="col">Del. Person ID</th>
            <th scope="col">Name</th>
            <th scope="col">City of Operations</th>
            <th scope="col">Maximal Del. Capacity</th>
            <th scope="col">Actions</th>
        </tr>
        <tr scope="row" th:each="delper: ${tbData}">
            <td th:text="${delper.delivererID}">error</td>
            <td th:text="${delper.name}">error</td>
            <td th:text="${delper.city}">error</td>
            <td th:text="${delper.deliveryMaxCapacity}  ">error</td>

            <td>
                <span th:with="id = ${delper.delivererID}">
                <a th:href="@{/showAllDeliveries(id=id)}" class="button btn btn-primary">Show Deliveries</a> </br>
                <a th:href="@{/modifyDeliveryPerson(id=id)}" class="button btn btn-secondary">Modify</a> </br>
                <a th:href="@{/fire(id=id)}" class="button btn btn-secondary">Fire</a>
                </span>
            </td>
        </tr>
    </table>
</section>



<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</body>
</html>
