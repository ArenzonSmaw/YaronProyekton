<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="height: 100%; margin: 0;"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{master.html}" lang="en">
<head>
    <title>Login Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
    <section layout:fragment="content">
        <form class="container-fluid" th:action="@{/processLogin}" th:object="${user}" method="post">
            <div class="row">
            <div class="col">
            <h2>🪵 Log In 🔒</h2>
            <br><br>
            <p>User Name: <input type="text" th:field="*{username}" /></p>

            <p>Password: <input type="password" th:field="*{password}" /></p>
            <br>

            <p style="color:red" th:text="${loginErrorMessage}"></p>

            <input type="submit" class="button btn btn-primary" value="Submit" />
            </div>
            <div class="col-auto ms-auto" th:if="${session.counter != null}" th:switch="${session.counter % 7}">
                <style>
                    img {
                        height: 450px;
                        max-width: 600px;
                    }
                </style>
                <img th:case="0" th:src="@{/image/delivery-instalator-1.png}" alt="error photo">
                <img th:case="1" th:src="@{/image/delivery-instalator-3.png}" alt="error photo">
                <img th:case="2" th:src="@{/image/delivery-instalator-4.png}" alt="error photo">
                <img th:case="3" th:src="@{/image/delivery-instalator-5.png}" alt="error photo">
                <img th:case="4" th:src="@{/image/instalator.png}" alt="error photo">
                <img th:case="5" th:src="@{/image/instalator-mario.png}" alt="error photo">
                <img th:case="6" th:src="@{/image/instalator-shark.png}" alt="error photo">
            </div>
            </div>
        </form>

        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    </section>
</body>
</html>
