<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" style="height: 100%; margin: 0;"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{master.html}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <style>
        img {
            height: 450px;
            max-width: 600px;
        }
    </style>
</head>
<body>

<section layout:fragment="content">
<h1>Success!</h1>
    <div th:switch="${type}">
        <div class="row">
            <div class="col">
                <p th:case="'delivery'" th:object="${delivery}" th:with="action = ${action}" th:text="'Delivery: ' + *{deliveryNo} + ', to: ' + *{destination} + ', has been ' + ${action} + ' successfully!'">delivery success message</p>
                <p th:case="'deliverer'" th:object="${deliverer}" th:with="action = ${action}" th:text="'Delivery person: ' + *{name} + ', of city: ' + *{city} + ', has been ' + ${action} + ' successfully!'">dliverer success message</p>
                </br><p th:if="${note != null}" th:text="${note}"></p>
            </div>
            <img th:if="${type == 'deliverer' && action == 'fired'}" class="col" th:src="@{/image/delivery-instalator-3.png}" alt="sad delivery plumber picture" >
            <img th:if="${type == 'deliverer' && action == 'added'}" class="col" th:src="@{/image/delivery-instalator-4.png}" alt="cool shark plumber picture" >
            <img th:if="${type == 'deliverer' && action == 'modified'}" class="col" th:src="@{/image/delivery-instalator-5.png}" alt="cool deliverer">
            <img th:if="${type == 'delivery' && action == 'added'}" class="col" th:src="@{/image/instalator.png}" alt="cool plumber picture" >
            <img th:if="${type == 'delivery' && action == 'reported delivered'}" class="col" th:src="@{/image/delivery-instalator-1.png}" alt="cool delivery guy plumber picture" >
            <img th:if="${type == 'delivery' && action == 'modified'}" class="col" th:src="@{/image/instalator-mario.png}" alt="cool mario picture">
        </div>
        <div th:case="*" class="row">
        <p class="col-5 justify-content-start">uhmm no object seems to be updated so heres a cool pic of a shark plumber</p>
        <img class="col justify-content-end" th:src="@{/image/instalator-shark.png}" alt="cool shark plumber photo">
        </div>
    </div>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</section>
</body>
</html>
