<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{master.html}" lang="en">
<head>
    <title th:text="${title}"></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

</head>
<body>
<section layout:fragment="content">
    <h2 th:text="${header}">Deliveries</h2>
    <p th:if="${message != null}" th:text="${message}"></p>
    <table class="table table-striped table-bordered">
        <tr>
            <th scope="col">Del. Number</th>
            <th scope="col">Weight</th>
            <th scope="col">Destination</th>
            <th scope="col">Customer Id</th>
            <th scope="col">Delivery Person</th>
            <th scope="col">Actions</th>
        </tr>
        <tr scope="row" th:each="delivery: ${tbData}">
            <td th:text="${delivery.deliveryNo}">error</td>
            <td th:text="${delivery.weight}">error</td>
            <td th:text="${delivery.destination}">error</td>
            <td th:text="${delivery.customerID}">error</td>
            <td>
                <span th:if="${delivery.ref != null}" th:object="${delivery.ref}">
                <span  th:text="'name: ' + *{name}">error</span> </br>
                <span  th:text="'id: ' + *{delivererID}">error</span>
                </span>
            </td>
            <td>
                <a th:href="@{/modifyDelivery(dlvNum=${delivery.deliveryNo})}" class="button btn btn-warning">Modify</a> </br>
                <a th:href="@{/delivered(dlvNum=${delivery.deliveryNo})}" class="button btn btn-danger">Report Delivered</a>
            </td>
        </tr>
    </table>
</section>



<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</body>
</html>
